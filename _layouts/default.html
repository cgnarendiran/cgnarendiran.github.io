<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<body>

  {% if site.google-analytics %}
    {% include google-analytics.html %}
  {% endif %}

  {% include header.html %}
  <!-- begin content -->
  <main class="content" aria-label="Content">
    <!-- begin wrapper-page -->
    <div class="wrapper-page">
      {{ content }}
    </div>
    <!-- end wrapper-page -->
  </main> 
  <!-- end content -->

  <div class="top" title="Top"><i class="ion ion-ios-arrow-up"></i></div>
  
  {% include footer.html %}
  
  {% include javascripts.html %}

  <!-- Include mathjax support.
       SVG output, not HTML-CSS/NativeMML: glyphs are drawn from paths bundled in the JS, so
       nothing depends on a webfont download or a system script font. HTML-CSS/NativeMML was
       rendering \mathcal{} as blank space in display and inline math alike.
       displayMath is declared explicitly because kramdown emits $$...$$ as \[ ... \]. -->
  <script type="text/x-mathjax-config">
    MathJax.Hub.Config({
      tex2jax: {
        inlineMath: [['$','$'], ['\\(','\\)']],
        displayMath: [['$$','$$'], ['\\[','\\]']],
        processEscapes: true
      },
      SVG: {
        scale: 100,
        linebreaks: { automatic: true }
      }
    });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.9/MathJax.js?config=TeX-AMS-MML_SVG" type="text/javascript"></script>
    
</body>

</html>
